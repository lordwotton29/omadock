name: CI

on:
  pull_request:
  push:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node & Python suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DockModel syntax
        run: node --check DockModel.js

      - name: Node test suites
        run: node --test tests/model.test.js tests/unit/*.test.mjs

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/test_helpers.py

      - name: Python test suites
        run: |
          python3 -m unittest tests.test_helpers
          python3 -m unittest discover -s tests/unit -p 'test_*.py'

  qml-lint:
    name: QML syntax gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint (Qt 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      # qmllint exits non-zero on parse errors, so this is a hard syntax gate;
      # diagnostics stay visible in the log. Typed checking against the Omarchy
      # shell and Quickshell modules only exists on an Omarchy host — that runs
      # in the release checklist (AGENTS.md "Verification Commands").
      - name: qmllint
        run: /usr/lib/qt6/bin/qmllint Dock.qml DockHost.qml components/*.qml

  manifest:
    name: Manifest schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Faithful mirror of `omarchy plugin validate` (see script header); the
      # authoritative validator runs on the Omarchy host before every release.
      - name: Validate manifest.json
        run: ./tests/manifest-check.sh .
